---
- name: Install Prezto
  git: repo=https://github.com/sorin-ionescu/prezto.git dest=~/.zprezto force=yes

- name: Symlink to $HOME
  file:
    src: ~/.config/dotfiles/home/{{ item }}
    dest: ~/{{ item }}
    state: link
    force: yes
  with_fileglob:
  - "~/.config/dotfiles/home/*"
  
- name: Directories $HOME/.config
  file:
    path: ~/.config/{{ item.path }}
    state: directory
    mode: '{{ item.mode }}'
  with_filetree: ~/.config/dotfiles/config/
  when: item.state == 'directory'
  
- name: Symlink to $HOME/.config
  file:
    src: '{{ item.src }}'
    dest: ~/.config/{{ item.path }}
    state: link
    force: yes
  with_filetree: ~/.config/dotfiles/config/
  when: item.state in ['file', 'hard', 'link']
